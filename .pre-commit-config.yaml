repos:
  - repo: https://github.com
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "120"]

  - repo: https://github.com
    rev: 24.3.0
    hooks:
      - id: black
        args: ["--line-length", "120"]

  - repo: https://github.com
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120"]